[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fsdetect"
version = "0.1.0"
description = "Adversarial robustness of false-success detection in LLM agent trajectories"
license = "MIT"
authors = [{ name = "Singaraj B", email = "singaraj.yali@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["scikit-learn==1.5.2", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.14.10"]

[tool.setuptools]
packages = ["fsdetect"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["fsdetect"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
